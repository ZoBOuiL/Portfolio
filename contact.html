<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Ugo Fortier-Tanghe</title>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <header class="navigation">
        <a href="index.html" class="Mon-Nom">Ugo Fortier Tanghe</a>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="projets.html">Mes Projets</a>
            <a href="contact.html" class="lien-actif">Contact</a>
        </nav>
    </header>

    <main class="mon-formulaire">

        <div class="haut-de-formulaire">
            <h1 class="Titre-formulaire">Besoin de me contacter ?</h1>
            <p class="instructions">Remplissez ce formulaire pour me contacter, ou contactez moi directement sur mes
                réseaux !</p>
            <div class="mes-reseaux">
                <a href="https://github.com/ZoBouiL" class="lien-github" target="_blank" aria-label="GitHub">
                    <img src="img/GitHub-Logo.png" alt="GitHub" style="height: 26px; width: auto; object-fit: contain;">
                    <span>GitHub</span>
                </a>
                <a href="https://www.linkedin.com/in/ugo-fortier-0b7a35396/" class="lien-linkedin" target="_blank" aria-label="LinkedIn">
                    <img src="img/LinkedIn_icon.svg.png" alt="LinkedIn" width="26" height="26"
                        style="object-fit: contain;">
                    <span>LinkedIn</span>
                </a>
            </div>
        </div>

        <form class="formulaire" action="#" method="post">

            <input type="text" name="nom" placeholder="Votre Nom">

            <input type="email" name="email" placeholder="Adresse e-mail">

            <textarea name="message" rows="6" placeholder="Votre message"></textarea>

            <button type="submit">ME CONTACTER</button>

        </form>
    </main>

</body>

</html>
